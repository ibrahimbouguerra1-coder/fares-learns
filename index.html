    <script>
      // Gracefully prevent and ignore Vite WebSocket HMR disconnects in cloud preview environments
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept Vite HMR WebSocket so it stays simulated OPEN and never rejects
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function FakeViteWebSocket(url, protocols) {
            var self = this;
            this.url = url;
            this.protocols = protocols;
            this.readyState = 1; // WebSocket.OPEN
            this.CONNECTING = 0;
            this.OPEN = 1;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.listeners = {};

            this.addEventListener = function(type, fn) {
              if (!self.listeners[type]) self.listeners[type] = [];
              self.listeners[type].push(fn);
              if (type === 'open') {
                setTimeout(function() {
                  try { fn({ type: 'open', target: self }); } catch(e) {}
                }, 0);
              }
            };

            this.removeEventListener = function(type, fn) {
              if (!self.listeners[type]) return;
              self.listeners[type] = self.listeners[type].filter(function(f) { return f !== fn; });
            };

            this.send = function() {};
            this.close = function() {
              self.readyState = 3;
            };
          }

          FakeViteWebSocket.CONNECTING = 0;
          FakeViteWebSocket.OPEN = 1;
          FakeViteWebSocket.CLOSING = 2;
          FakeViteWebSocket.CLOSED = 3;

          function WebSocketProxy(url, protocols) {
            var isVite = (protocols === 'vite-hmr') ||
                         (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
            if (isVite) {
              return new FakeViteWebSocket(url, protocols);
            }
            return new RealWebSocket(url, protocols);
          }

          WebSocketProxy.CONNECTING = 0;
          WebSocketProxy.OPEN = 1;
          WebSocketProxy.CLOSING = 2;
          WebSocketProxy.CLOSED = 3;
          WebSocketProxy.prototype = RealWebSocket.prototype;

          window.WebSocket = WebSocketProxy;
        }

        // 2. Filter any residual console.error from @vite/client
        var origError = console.error;
        console.error = function() {
          var str = arguments[0] ? String(arguments[0]) : '';
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };

        // 3. Catch window errors & unhandled promise rejections for WebSockets
        window.addEventListener('error', function (e) {
          var msg = (e && e.message) ? e.message : (e && e.error && e.error.message) ? e.error.message : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
